[project]
name = "pipette-agent"
version = "0.1.0"
description = "Claude tool-calling agent for a simulated liquid handler, with code-enforced safety and evals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pipette-evals = "pipette_agent.evals:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipette_agent"]

[project]
name = "pipette-agent"
version = "0.2.0"
description = "Claude tool-calling agent for a simulated liquid handler, with code-enforced safety and evals"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Elliot Whittard" }]
keywords = ["claude", "llm-agents", "lab-automation", "liquid-handling", "ai-safety", "evals"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["anthropic>=0.40"]

[project.urls]
Repository = "https://github.com/eliwhi/pipette-agent"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pipette-evals = "pipette_agent.evals:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipette_agent"]
